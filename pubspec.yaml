name: hvac_scrap_app
description: "Kabbas: HVAC pipe installation, maintenance, scrap collection and spare parts."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_core_platform_interface: ^8.1.0

flutter:

  uses-material-design: true
  assets:
    - assets/branding/logo.jpeg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo.jpeg"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/logo.jpeg"
    background_color: "#FFFFFF"
    theme_color: "#073679"
